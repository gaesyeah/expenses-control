services:
  postgres:
    image: postgres:17-alpine
    container_name: expenses-control-db
    environment:
      POSTGRES_USER: expenses
      POSTGRES_PASSWORD: expenses
      POSTGRES_DB: expensescontrol
    ports:
      - "5433:5432"
    volumes:
      - expenses-control-data:/var/lib/postgresql/data

volumes:
  expenses-control-data:
